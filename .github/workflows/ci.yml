name: Python 3.x application with uv on Ubuntu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12", "3.13", "3.14", "3.15" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv - latest if not defined in `pyproject.toml`
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Setup Python ${{ matrix.python-version }}
        # Faster than using uv, as it caches Python on GitHub runner
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Lint with ruff
        # by default: exit with error if rule violations
        run: uv run --locked ruff check --output-format=github

      - name: Lint format with ruff
        # by default: exit with error if rule violations
        run: uv run --locked ruff format

      - name: Type check with pyrefly
        run: uv run --locked pyrefly check --output-format=github

      - name: Test with pytest
        run: uv run --locked pytest
