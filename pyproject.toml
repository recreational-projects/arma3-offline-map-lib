[project]
name = "arma3-offline-map-lib"
version = "0.8.0"
description = "Code shared between Arma 3 mapping projects."
readme = "README.md"
authors = [
    { name = "recreational-projects", email = "205627218+recreational-projects@users.noreply.github.com" }
]
urls = { "source" = "https://github.com/recreational-projects/arma3-offline-map-lib" }
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "msgspec>=0.21.1",
    "numpy>=2.4.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pre-commit>=4.6.2",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff.lint]
future-annotations = true
select = ["ALL"]

ignore = [
    "COM812", # missing-trailing-comma: conflicts with formatter
    "CPY001", # missing-copyright-notice
    "D205", # don't require 1-line summary
]
extend-safe-fixes = [
    "TC", # flake8-type-checking
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "S101", # assert
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
project-includes = ["**/*.py*"]

[tool.uv]
resolution = "lowest-direct"
